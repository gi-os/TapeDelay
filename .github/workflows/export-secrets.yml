name: Export secrets to the hub
# One-off on a throwaway branch: copies TapeDelay's signing secrets into gi-os/ios-certs.
on:
  push:
    branches: [claude/export-secrets]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.HUB_TOKEN }}
      HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_AUTH: ${{ secrets.MATCH_GIT_AUTH }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Copy into gi-os/ios-certs
        run: |
          [ -n "$HUB_TOKEN" ] || { echo "::error::Set HUB_TOKEN on gi-os/TapeDelay first"; exit 1; }
          for n in HUB_TOKEN ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 MATCH_PASSWORD MATCH_GIT_AUTH CLAUDE_CODE_OAUTH_TOKEN; do
            if [ -z "${!n}" ]; then echo "::warning::$n isn't set on TapeDelay; skipped"; continue; fi
            printf '%s' "${!n}" | gh secret set "$n" -R gi-os/ios-certs
            echo "Copied $n"
          done
      - name: Remove HUB_TOKEN from TapeDelay
        run: gh secret delete HUB_TOKEN -R gi-os/TapeDelay
